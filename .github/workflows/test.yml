name: Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  gate:
    name: Lint + green test files (blocking)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The repo has no package-lock.json (zero runtime deps; eslint is the only devDependency), so npm ci would fail.
      - run: npm install --no-audit --no-fund
      - run: npx eslint src/
      # test/install-macos.test.js is macOS-only (launchctl, ~/Library paths) and fails on
      # ubuntu runners; it is not in the green list. Run it locally on macOS.
      - name: Test files that pass at the 2026-09-22 baseline
        run: xargs node --test < .github/ci-green-files.txt
      - name: auth-revoked quarantine contract (account-manager.test.js)
        run: node --test --test-name-pattern='auth-revoked|invalid_grant|quarantine' test/account-manager.test.js

  full-suite:
    name: Full suite (informational until the pre-existing failures are triaged)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
