name: Token report skill
on:
  pull_request:
    paths: ['skills/token-usage-report/**', '.claude-plugin/**', '.github/workflows/token-report.yml']
  push:
    branches: ['qjc/resilient-routing']
    paths: ['skills/token-usage-report/**', '.claude-plugin/**', '.github/workflows/token-report.yml']
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: python3 skills/token-usage-report/scripts/test_trends.py
      - run: node --test skills/token-usage-report/tests/*.test.mjs
      - run: python3 -m json.tool .claude-plugin/plugin.json > /dev/null
      - run: python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
