<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>토큰 사용 분석 · TeamClaude × TeamCodex</title>
<style>
:root{--bg:#f7f8fc;--card:#fff;--ink:#182038;--muted:#68718a;--line:#e5e8f0;--claude:#eb6b9b;--codex:#3d5cc8;--accent:#213f95}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}main{width:min(1440px,calc(100% - 40px));margin:34px auto 70px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}h1{font-size:clamp(30px,4vw,46px);letter-spacing:-.05em;margin:0 0 8px}.sub,.hint,.small{color:var(--muted);font-size:13px}.stamp{text-align:right;color:var(--muted);font-size:13px;line-height:1.6}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button,select,input{border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--card);color:var(--ink);font:inherit}button{cursor:pointer}button.active{background:var(--accent);color:#fff;border-color:var(--accent)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:0 5px 18px #29365c0b}.label{color:var(--muted);font-size:13px}.kpi{font-size:29px;font-weight:750;letter-spacing:-.04em;margin:5px 0}.panel{margin-top:13px}.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}h2{font-size:19px;letter-spacing:-.03em;margin:0}.split{display:grid;grid-template-columns:1.1fr .9fr;gap:13px}.bars{display:flex;flex-direction:column;gap:12px}.bar{display:grid;grid-template-columns:minmax(145px,1fr) 2.5fr 95px;align-items:center;gap:10px;font-size:14px}.barname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track,.meter{height:14px;background:#eef0f6;border-radius:99px;overflow:hidden}.fill{height:100%;min-width:2px;border-radius:99px}.meta{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}.vendor{font-weight:700}.claude{color:var(--claude)}.codex{color:var(--codex)}svg{width:100%;height:250px}.legend{display:flex;gap:15px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:12px;color:var(--muted)}.num{text-align:right;font-variant-numeric:tabular-nums}.notes{color:var(--muted);font-size:13px;line-height:1.7}.notes ol{margin:6px 0 0 20px;padding:0}.quota{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.qbox{border:1px solid var(--line);border-radius:10px;padding:11px}.qtitle{font-weight:700;margin-bottom:8px}.qline{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:7px}.empty{color:var(--muted);padding:28px 0}@media(max-width:900px){main{width:min(100% - 24px,680px);margin-top:23px}header{display:block}.stamp{text-align:left;margin-top:8px}.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.bar{grid-template-columns:120px 1fr 78px}}@media(max-width:540px){.card{padding:13px}.kpi{font-size:22px}.bar{grid-template-columns:95px 1fr 66px;font-size:12px}}@media(prefers-color-scheme:dark){:root{--bg:#111522;--card:#191e2d;--ink:#f0f3fb;--muted:#a7afc5;--line:#2d3449}.track,.meter{background:#252c40}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body><main>
<header><div><h1>토큰 사용 분석</h1><div class="sub">TeamClaude × TeamCodex · 프로젝트별 처리량과 소진 속도</div></div><div class="stamp" id="stamp">데이터 로딩 중…</div></header>
<div class="toolbar"><div id="windows"><button data-h="1">최근 1시간</button><button data-h="24" class="active">최근 24시간</button><button data-h="168">최근 7일</button><button data-h="720">최근 1개월</button><button data-h="8760">최근 1년</button></div><div class="filters"><label class="small" for="vendor">벤더</label><select id="vendor"><option value="all">전체</option><option>Claude</option><option>Codex</option></select><label class="small" for="metric">지표</label><select id="metric"><option value="total">처리 토큰</option><option value="noncached">캐시 제외</option></select><input id="search" placeholder="세션 검색" aria-label="세션 검색"></div></div>
<section class="grid" id="kpis"></section>
<section class="split panel"><article class="card"><div class="panel-head"><h2>프로젝트별 처리 토큰</h2><span class="hint">상위 12개 · 자동 분류</span></div><div id="projects" class="bars"></div></article><article class="card" id="trend-panel"><div class="panel-head"><h2 id="trend-title">시간별 소진 속도</h2><span class="hint" id="rateHint">기간 기준</span></div><p id="trend-context" class="hint"></p><div id="chart"></div><div class="legend"><span><i class="dot" style="background:var(--claude)"></i>Claude</span><span><i class="dot" style="background:var(--codex)"></i>Codex</span></div></article></section>
<section class="card panel"><div class="panel-head"><h2>작업 세션 순위</h2><span class="hint">session_id는 식별용 일부만 표시</span></div><div class="tablewrap"><table><thead><tr><th>#</th><th>벤더</th><th>프로젝트</th><th>작업 분류</th><th>branch</th><th class="num">지표 토큰</th><th class="num">요청</th><th class="num">시간당</th></tr></thead><tbody id="sessions"></tbody></table></div></section>
<section class="split panel"><article class="card"><div class="panel-head"><h2>현재 계정 쿼터 스냅샷</h2><span class="hint">생성 시점</span></div><div id="quota" class="quota"></div></article><article class="card notes"><div class="panel-head"><h2>해석 기준과 한계</h2></div><ol id="notes"></ol></article></section>
</main>
<script>
let D,H='24',V='all',M='total',Q='';const C={Claude:'#eb6b9b',Codex:'#3d5cc8'};
const f=n=>{n=Number(n)||0;return Math.abs(n)>=1e9?(n/1e9).toFixed(2)+'B':Math.abs(n)>=1e6?(n/1e6).toFixed(1)+'M':Math.abs(n)>=1e3?(n/1e3).toFixed(1)+'K':Math.round(n).toLocaleString('ko-KR')};
const esc=s=>String(s??'').replace(/[&<>'"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]));
const list=a=>V==='all'?a:a.filter(x=>x.vendor===V);const metric=x=>Number(x[M]||0);const rate=x=>Number(x[M==='total'?'perHour':'noncachedPerHour']||0);const kst=t=>new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(t*1000));
function render(){const w=D.windows[H],vs=list(w.vendors),ps=list(w.projects).sort((a,b)=>metric(b)-metric(a)),ss=list(w.sessions).filter(x=>(x.project+' '+x.branch+' '+x.task+' '+x.id).toLowerCase().includes(Q.toLowerCase())).sort((a,b)=>metric(b)-metric(a)),all=vs.reduce((n,x)=>n+metric(x),0),top=ps[0],one=list(D.windows['1'].vendors),recent=one.reduce((n,x)=>n+metric(x),0),avg=vs.reduce((n,x)=>n+rate(x),0);
document.querySelector('#stamp').textContent='생성 '+new Date(D.generatedAt*1000).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+' KST · '+w.events.toLocaleString('ko-KR')+'개 집계 이벤트';
const ca=vs.find(x=>x.vendor==='Claude'),co=vs.find(x=>x.vendor==='Codex'),speed=vs.reduce((n,x)=>n+rate(x),0);document.querySelector('#kpis').innerHTML=[['전체 '+(M==='total'?'처리':'캐시 제외')+' 토큰',f(all),'Claude '+f(ca?metric(ca):0)+' · Codex '+f(co?metric(co):0)],['가장 큰 프로젝트',top?esc(top.project):'—',top?top.vendor+' · '+f(metric(top)):'—'],['평균 소진 속도',f(speed)+'/h','선택 기간 전체 시간 평균 · '+(V==='all'?'전체':V)],['최근 1시간 강도',f(recent)+'/h','최근 1시간 실측 · '+f(recent/Math.max(1,avg))+'× 선택기간 평균']].map(x=>'<article class="card"><div class="label">'+x[0]+'</div><div class="kpi">'+x[1]+'</div><div class="small">'+x[2]+'</div></article>').join('');
const max=Math.max(1,...ps.slice(0,12).map(metric));document.querySelector('#projects').innerHTML=ps.slice(0,12).map(x=>'<div class="bar"><div class="barname"><b class="vendor '+x.vendor.toLowerCase()+'">'+esc(x.vendor)+'</b> · '+esc(x.project)+'</div><div class="track"><div class="fill" style="width:'+metric(x)/max*100+'%;background:'+C[x.vendor]+'"></div></div><div class="meta" title="'+metric(x).toLocaleString()+' 토큰">'+f(metric(x))+'<br><span>'+f(rate(x))+'/h</span></div></div>').join('')||'<div class="empty">기록이 없습니다.</div>';
document.querySelector('#sessions').innerHTML=ss.slice(0,30).map((x,i)=>'<tr><td>'+(i+1)+'</td><td class="vendor '+x.vendor.toLowerCase()+'">'+esc(x.vendor)+'</td><td>'+esc(x.project)+'</td><td>'+esc(x.task)+'</td><td title="'+esc(x.branch)+'">'+esc((x.branch||'—').slice(0,32))+'</td><td class="num" title="'+metric(x).toLocaleString()+'">'+f(metric(x))+'</td><td class="num">'+x.requests.toLocaleString()+'</td><td class="num">'+f(rate(x))+'</td></tr>').join('')||'<tr><td colspan="8" class="empty">조건에 맞는 세션이 없습니다.</td></tr>';
document.querySelector('#rateHint').textContent=H==='1'?'토큰/5분 버킷 · 기간 경계 일부 포함':'토큰/시간 · 기간 경계 일부 포함';draw(w);drawQuota()}
function draw(w){const rows=list(w.timeline),step=H==='1'?300:3600,by={},present={},keys=[];for(const r of rows){const k=Math.floor(r.ts/step)*step;by[k]??={Claude:0,Codex:0};present[k]??={Claude:false,Codex:false};by[k][r.vendor]+=metric(r);present[k][r.vendor]=r.requests>0}for(let t=Math.floor(w.start/step)*step;t<=w.end;t+=step)keys.push(t);const W=660,Hh=230,p={l:48,r:10,t:14,b:35},max=Math.max(1,...keys.map(k=>(by[k]?.Claude||0)+(by[k]?.Codex||0))),x=i=>p.l+i/Math.max(1,keys.length-1)*(W-p.l-p.r),y=n=>Hh-p.b-n/max*(Hh-p.t-p.b);let s='<svg viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="시간별 토큰 처리량"><path d="M'+p.l+' '+p.t+'V'+(Hh-p.b)+'H'+(W-p.r)+'" stroke="#dfe3ed" fill="none"/>';for(const v of ['Claude','Codex']){let path='',open=false;keys.forEach((k,i)=>{if(!present[k]?.[v]){open=false;return}path+=(open?'L':'M')+x(i)+' '+y(by[k][v]);open=true});s+='<path d="'+path+'" fill="none" stroke="'+C[v]+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'}for(let i=0;i<keys.length;i+=Math.max(1,Math.floor(keys.length/5)))s+='<text x="'+x(i)+'" y="'+(Hh-10)+'" text-anchor="middle" fill="#68718a" font-size="11">'+kst(keys[i])+'</text>';s+='<text x="'+(p.l-7)+'" y="'+(p.t+4)+'" text-anchor="end" fill="#68718a" font-size="11">'+f(max)+'</text><text x="'+(p.l-7)+'" y="'+(Hh-p.b+4)+'" text-anchor="end" fill="#68718a" font-size="11">0</text></svg>';document.querySelector('#chart').innerHTML=s}
function drawQuota(){document.querySelector('#quota').innerHTML=D.quota.pools.map(p=>p.error?'<div class="qbox"><b>'+esc(p.name)+'</b><div class="empty">조회 실패</div></div>':'<div class="qbox"><div class="qtitle">'+esc(p.name)+' · usable '+p.usable+'/'+p.count+'</div>'+p.accounts.map(a=>'<div class="qline"><span>'+esc(a.label)+' · '+esc(a.status||'unknown')+'</span><b>'+(a.session==null?'—':(a.session*100).toFixed(0)+'%')+' / '+(a.weekly==null?'—':(a.weekly*100).toFixed(0)+'%')+'</b></div>').join('')+'</div>').join('')||'<div class="empty">쿼터 스냅샷 없음</div>'}
document.querySelectorAll('#windows button').forEach(b=>b.addEventListener('click',()=>{H=b.dataset.h;document.querySelectorAll('#windows button').forEach(x=>x.classList.toggle('active',x===b));render()}));document.querySelector('#vendor').addEventListener('change',e=>{V=e.target.value;render()});document.querySelector('#metric').addEventListener('change',e=>{M=e.target.value;render()});document.querySelector('#search').addEventListener('input',e=>{Q=e.target.value;render()});(window.REPORT_DATA?Promise.resolve(window.REPORT_DATA):fetch('data.json').then(r=>r.json())).then(x=>{D=x;document.querySelector('#notes').innerHTML=D.methodology.map(x=>'<li>'+esc(x)+'</li>').join('');render()}).catch(()=>{document.querySelector('#stamp').textContent='내장 데이터 또는 data.json을 읽지 못했습니다.'});
</script><script src="pricing-core.js"></script><script src="insights.js"></script><script src="pricing-ui.js"></script><script src="trends.js"></script><script src="share.js"></script><link rel="stylesheet" href="design.css"><link rel="stylesheet" href="price-layout.css"><link rel="stylesheet" href="design-trends.css"></body></html>
